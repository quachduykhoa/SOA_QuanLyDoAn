spring.application.name=sinhvien-service
server.port=8081

# Database Configuration (Database-per-service: sinhvien_db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sinhvien_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# External Service Endpoints (Supports both local direct URL and Docker container hostnames)
services.sinhvien.url=${SERVICES_SINHVIEN_URL:http://localhost:8081}
services.detai.url=${SERVICES_DETAI_URL:http://localhost:8082}

# JWT Secret - Base64 encoded
jwt.secret=${JWT_SECRET:U09BX0lOU0VUQVJPTl9TSVpaQ0hVTktFRA==}