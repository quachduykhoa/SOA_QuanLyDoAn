server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: sinhvien-service
          uri: ${SERVICES_SINHVIEN_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/sinhvien/**
        - id: detai-service
          uri: ${SERVICES_DETAI_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/detai/**
        - id: dangky-service
          uri: ${SERVICES_DANGKY_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/dangky/**
