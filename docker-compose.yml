version: '3.8'

services:
  mysql:
    image: "docker.io/library/mysql:8.0"
    container_name: soa-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - soa-network

  sinhvien-service:
    build:
      context: ./sinhvien-service
    container_name: soa-sinhvien-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8081
      - JWT_SECRET=U09BX0pXVF9TZWNyZXRfU09BX0RvQW5fMjAyNl9Tb2FfVG9UbmdOb2doaXBfU2VjcmV0
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sinhvien_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  detai-service:
    build:
      context: ./detai-service
    container_name: soa-detai-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8082
      - JWT_SECRET=U09BX0pXVF9TZWNyZXRfU09BX0RvQW5fMjAyNl9Tb2FfVG9UbmdOb2doaXBfU2VjcmV0
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/detai_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  dangky-service:
    build:
      context: ./dangky-service
    container_name: soa-dangky-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8083
      - JWT_SECRET=U09BX0pXVF9TZWNyZXRfU09BX0RvQW5fMjAyNl9Tb2FfVG9UbmdOb2doaXBfU2VjcmV0
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/dangky_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SERVICES_SINHVIEN_URL=http://sinhvien-service:8081
      - SERVICES_DETAI_URL=http://detai-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      sinhvien-service:
        condition: service_started
      detai-service:
        condition: service_started
    networks:
      - soa-network

  auth-service:
    build:
      context: ./auth-service
    container_name: soa-auth-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET=U09BX0pXVF9TZWNyZXRfU09BX0RvQW5fMjAyNl9Tb2FfVG9UbmdOb2doaXBfU2VjcmV0
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soa-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: soa-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVICES_SINHVIEN_URL=http://sinhvien-service:8081
      - SERVICES_DETAI_URL=http://detai-service:8082
      - SERVICES_DANGKY_URL=http://dangky-service:8083
      - SERVICES_AUTH_URL=http://auth-service:8084
    depends_on:
      - sinhvien-service
      - detai-service
      - dangky-service
    networks:
      - soa-network

volumes:
  mysql-data:

networks:
  soa-network:
    driver: bridge
